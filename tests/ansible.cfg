[defaults]
inventory = clab-ansible/ansible-inventory.yml

host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

remote_port = 57400

[inventory]
# A play whose host pattern names a group the lab lacks fails instead of running on fewer hosts
host_pattern_mismatch = error

[grpc_connection]
grpc_environment = {'https_proxy': 0, 'http_proxy': 0, 'HTTPS_PROXY': 0, 'HTTP_PROXY': 0}
root_certificates_file = ./clab-ansible/.tls/ca/ca.pem

[persistent_connection]
command_timeout = 120
