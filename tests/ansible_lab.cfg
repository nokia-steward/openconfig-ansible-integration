[defaults]
inventory = clab-lab/ansible-inventory.yml
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
collections_paths = ../

[inventory]
host_pattern_mismatch = error

[grpc_connection]
grpc_environment = {'https_proxy': 0, 'http_proxy': 0, 'HTTPS_PROXY': 0, 'HTTP_PROXY': 0}

[persistent_connection]
command_timeout = 120
