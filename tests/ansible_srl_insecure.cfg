# Plain-text gNMI to SR Linux (port 57401) for troubleshooting:
#   ANSIBLE_CONFIG=ansible_srl_insecure.cfg ./run.sh run --category srlinux

[defaults]
inventory = clab-ansible/ansible-inventory.yml,platforms.yml

host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

remote_port = 57401

[inventory]
host_pattern_mismatch = error

[grpc_connection]
grpc_environment = {'https_proxy': 0, 'http_proxy': 0, 'HTTPS_PROXY': 0, 'HTTP_PROXY': 0}

[persistent_connection]
command_timeout = 120
