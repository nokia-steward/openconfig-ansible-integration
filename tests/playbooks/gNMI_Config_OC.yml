---
- name: OpenConfig Set/Get Configuration
  hosts: nokia_srsim:nokia_srlinux
  gather_facts: false

  vars:
    ansible_connection: nokia.openconfig.grpc
    leaf_path: "{{ oc_lldp_enabled_path }}"
    demo_enabled: true
  vars_files:
    - vars/model_oc.yml

  tasks:
    - name: Remember the original LLDP enabled state
      ansible.builtin.include_tasks: tasks/read_leaf.yml

    - name: Store the original value
      ansible.builtin.set_fact:
        original_enabled: "{{ leaf_value }}"

    - name: Enable LLDP (OpenConfig)
      nokia.openconfig.gnmi_set:
        update:
          - path: "{{ leaf_path }}"
            value: "{{ demo_enabled }}"
      register: change

    - name: Check that the change was detected
      ansible.builtin.assert:
        that:
          - change is changed or (original_enabled != '' and original_enabled | bool == demo_enabled)
          - (change.output | from_json).response | map(attribute='op') | list == ['UPDATE']

    - name: Read LLDP enabled
      ansible.builtin.include_tasks: tasks/read_leaf.yml

    - name: Check LLDP is enabled
      ansible.builtin.assert:
        that:
          - leaf_value | bool == demo_enabled

    - name: Apply the same change again
      nokia.openconfig.gnmi_set:
        update:
          - path: "{{ leaf_path }}"
            value: "{{ demo_enabled }}"
      register: again

    - name: Check idempotency
      ansible.builtin.assert:
        that:
          - again is not changed

    - name: Disable LLDP
      nokia.openconfig.gnmi_set:
        update:
          - path: "{{ leaf_path }}"
            value: false
      register: cleanup

    - name: Read LLDP enabled again
      ansible.builtin.include_tasks: tasks/read_leaf.yml

    - name: Check LLDP was disabled
      ansible.builtin.assert:
        that:
          - cleanup is changed
          - leaf_value | bool == false

    - name: Restore the original LLDP enabled state
      nokia.openconfig.gnmi_set:
        update: "{{ [{'path': leaf_path, 'value': original_enabled | bool}] if original_enabled != '' else omit }}"
        delete: "{{ [leaf_path] if original_enabled == '' else omit }}"
