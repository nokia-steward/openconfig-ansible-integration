---
- name: gNMI · capabilities
  hosts: all
  gather_facts: false

  vars:
    ansible_connection: nokia.openconfig.grpc

  tasks:
    - name: Get capabilities
      nokia.openconfig.gnmi_capabilities:
      register: caps

    - name: Check capabilities
      ansible.builtin.assert:
        that:
          - caps.gnmi_version is version('0.7.0', '>=')
          - caps.output.gNMIVersion == caps.gnmi_version
          - "'JSON_IETF' in caps.encodings or 'JSON' in caps.encodings"
          - caps.models | length > 0
          - caps.models | selectattr('name', 'defined') | list | length == caps.models | length
          - caps is not changed
