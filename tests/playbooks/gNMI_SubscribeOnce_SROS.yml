---
- name: gNMI · subscribe once · Nokia SROS
  hosts: nokia_srsim
  gather_facts: false

  vars:
    ansible_connection: nokia.openconfig.grpc

  tasks:
    - name: Get /configure using Subscribe ONCE
      nokia.openconfig.gnmi_subscribe:
        mode: once
        path:
          - /configure
      register: once

    - name: Check the configuration tree
      vars:
        configure: "{{ (once.output | from_json).configure }}"
      ansible.builtin.assert:
        that:
          - configure is mapping
          - configure.system is mapping
          - configure.system.name is defined
