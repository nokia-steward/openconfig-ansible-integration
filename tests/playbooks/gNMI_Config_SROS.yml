---
- name: gNMI · config set/get · Nokia SROS
  hosts: nokia_srsim
  gather_facts: false

  vars:
    ansible_connection: nokia.openconfig.grpc

  tasks:
    - name: Read the current location and contact
      nokia.openconfig.gnmi_get:
        type: config
        prefix: /configure
        path:
          - system/location
          - system/contact
      register: before

    - name: Store the original values
      vars:
        system: "{{ ((before.output | from_json).configure | default({})).system | default({}) }}"
      ansible.builtin.set_fact:
        original_location: "{{ system.location | default('') }}"
        original_contact: "{{ system.contact | default('') }}"

    - name: Change the configuration
      block:
        # With JSON_IETF, SR OS expects nokia-conf: qualified member names in
        # container values and ignores a REPLACE without them; plain JSON
        # takes the names as they are.
        - name: Change configuration in one transaction
          nokia.openconfig.gnmi_set:
            prefix: /configure
            encoding: json
            update:
              - path: system/location
                value: ansible-location
              - path: system/contact
                value: ansible-contact
            replace:
              - path: service/md-auto-id
                value:
                  service-id-range:
                    start: 10000
                    end: 99999
                  customer-id-range:
                    start: 10000
                    end: 10999
            delete:
              - system/cron
          register: change
          diff: true

        - name: Check the SetResponse
          ansible.builtin.assert:
            that:
              - change is changed
              - (change.output | from_json).response | map(attribute='op') | sort == ['DELETE', 'REPLACE', 'UPDATE', 'UPDATE']

        - name: Read the changed configuration
          nokia.openconfig.gnmi_get:
            type: config
            prefix: /configure
            path:
              - system/location
              - system/contact
              - service/md-auto-id
          register: after

        - name: Check the change
          vars:
            config: "{{ (after.output | from_json).configure }}"
          ansible.builtin.assert:
            that:
              - config.system.location == 'ansible-location'
              - config.system.contact == 'ansible-contact'
              - after.output is search('service-id-range"')
              - after.output is search('10000')

        - name: Apply the same update again
          nokia.openconfig.gnmi_set:
            prefix: /configure
            update:
              - path: system/location
                value: ansible-location
              - path: system/contact
                value: ansible-contact
          register: again

        - name: Check idempotency
          ansible.builtin.assert:
            that:
              - again is not changed

      always:
        - name: Remove the demo configuration
          nokia.openconfig.gnmi_set:
            prefix: /configure
            delete: "{{ ['service/md-auto-id']
              + ([] if original_location != '' else ['system/location'])
              + ([] if original_contact != '' else ['system/contact']) }}"

        - name: Restore the original location and contact
          nokia.openconfig.gnmi_set:
            prefix: /configure
            update: "{{ ([{'path': 'system/location', 'value': original_location}] if original_location != '' else [])
              + ([{'path': 'system/contact', 'value': original_contact}] if original_contact != '' else []) }}"
          when: original_location != '' or original_contact != ''
