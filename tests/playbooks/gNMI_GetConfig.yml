---
- name: gNMI · get full configuration
  hosts: all
  gather_facts: false

  vars:
    ansible_connection: nokia.openconfig.grpc

  tasks:
    - name: Get the full configuration
      nokia.openconfig.gnmi_get:
        type: config
      register: full

    - name: Check the configuration tree
      ansible.builtin.assert:
        that:
          - full.output | from_json is mapping
          - full.output | from_json | length > 0
          - full is not changed

    - name: Get the full configuration, values only
      nokia.openconfig.gnmi_get:
        type: config
        values_only: true
      register: values

    - name: Check the values
      ansible.builtin.assert:
        that:
          - values.output | from_json | length > 0
