---
- name: gNMI · config backup
  hosts: all
  gather_facts: false

  vars:
    ansible_connection: nokia.openconfig.grpc
    backup_dir: "{{ playbook_dir }}/../output/backup"

  tasks:
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0755"

    - name: Backup the configuration
      nokia.openconfig.gnmi_set:
        backup: true
        backup_options:
          dir_path: "{{ backup_dir }}"
          filename: "{{ inventory_hostname }}.json"
      register: backup

    - name: Check the backup file
      ansible.builtin.assert:
        that:
          - backup.backup_path == backup_dir + '/' + inventory_hostname + '.json'
          - lookup('ansible.builtin.file', backup.backup_path) | from_json is mapping
          - lookup('ansible.builtin.file', backup.backup_path) | from_json | length > 0
