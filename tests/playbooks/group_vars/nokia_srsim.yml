---
# SR OS native YANG (nokia-conf / nokia-state) used by the platform playbooks.

# gNMI Depth extension (Get and Subscribe)
depth_path: /configure/router[router-name=Base]

# gNMI Commit extension: a string leaf changed by confirmed commits
commit_path: /configure/system/location

# gNMI ConfigSubscription extension
config_sub_path: /configure/system
config_leaf: contact
# /configure has no state leaves to filter out
state_leaf: ''
# SR OS rejects ConfigSubscription in Subscribe ONCE mode (STREAM only)
config_subscription_once_supported: false

# gNOI
# SR OS rejects PingRequest.network_instance (GMI #2007, seen on 25.7.R2), so
# System Ping and Traceroute run in Base and target the system address
gnoi_network_instance: ''
gnoi_ping_destination: 10.0.0.110
gnoi_file_dir: "cf3:"
# SR OS accepts only 555 (read-only) and 777; a read-only file cannot be
# overwritten or removed over gNOI
gnoi_file_permissions: 777
