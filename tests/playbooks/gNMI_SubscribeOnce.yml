---
- name: gNMI · subscribe once
  hosts: all
  gather_facts: false

  vars:
    ansible_connection: nokia.openconfig.grpc

  tasks:
    - name: Get everything using Subscribe ONCE
      nokia.openconfig.gnmi_subscribe:
        mode: once
        path:
          - /
      register: once

    - name: Check the object tree
      ansible.builtin.assert:
        that:
          - once.output | from_json is mapping
          - once.output | from_json | length > 0
          - once is not changed
