---
requires_ansible: ">=2.18.0"

# module_defaults group for the gNMI modules that take paths, for example
# to set origin, encoding or target once per play: group/nokia.openconfig.gnmi
action_groups:
  gnmi:
    - gnmi_get
    - gnmi_set
    - gnmi_subscribe

plugin_routing:
  connection:
    gnmi:
      tombstone:
        removal_version: 2.0.0
        warning_text: Use nokia.openconfig.grpc instead.
  modules:
    gnmi_config:
      tombstone:
        removal_version: 2.0.0
        warning_text: Use nokia.openconfig.gnmi_set instead.
